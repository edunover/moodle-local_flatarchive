name: Flatarchive tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatarchive-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed AMD build
        run: git diff --exit-code -- amd/build
      - run: npm test

  phpunit:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.1'
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.2'
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.3'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.1'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.2'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.3'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.2'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.3'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.4'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.2'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.3'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.4'
          - moodle: '5.2'
            branch: MOODLE_502_STABLE
            php: '8.3'
          - moodle: '5.2'
            branch: MOODLE_502_STABLE
            php: '8.4'
          - moodle: '5.3'
            branch: MOODLE_503_STABLE
            php: '8.3'
            mariadb: '11.4'
          - moodle: '5.3'
            branch: MOODLE_503_STABLE
            php: '8.4'
            mariadb: '11.4'
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb || '10.11' }}
        env:
          MARIADB_ROOT_PASSWORD: flatarchive-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, soap, zip, gd, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle test tools
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4.5.9'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install isolated Moodle and test database
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-user=root --db-pass=flatarchive-ci --no-plugin-node
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.branch }}
      - name: Check PHP syntax
        run: moodle-plugin-ci phplint
      - name: Check Moodle conventions for the updated PHP files
        if: (matrix.moodle == '5.2' || matrix.moodle == '5.3') && matrix.php == '8.4'
        run: >-
          phpcs --standard=moodle
          plugin/classes/archive/tags.php plugin/tests/tags_test.php
          plugin/classes/archive/forum_exporter.php plugin/tests/forum_exporter_test.php
          plugin/classes/archive/lesson_exporter.php plugin/tests/lesson_exporter_test.php
          plugin/classes/archive/lesson_attempts.php plugin/tests/lesson_attempts_test.php plugin/tests/visibility_test.php
          plugin/tests/index_navigation_test.php
          plugin/classes/archive/quiz_exporter.php plugin/classes/archive/quiz_question.php plugin/tests/quiz_exporter_test.php
          plugin/classes/archive/choice_exporter.php plugin/tests/choice_exporter_test.php
          plugin/classes/archive/index_icons.php plugin/tests/index_icons_test.php
          plugin/classes/archive/feedback_exporter.php plugin/tests/feedback_exporter_test.php
          plugin/classes/archive/wiki_exporter.php plugin/tests/wiki_exporter_test.php
          plugin/classes/archive/glossary_exporter.php plugin/tests/glossary_exporter_test.php
          plugin/classes/archive/folder_exporter.php plugin/tests/folder_exporter_test.php
          plugin/serve_temp.php plugin/classes/archive/temporary_archive.php plugin/tests/temporary_archive_test.php
          plugin/classes/archive/label_exporter.php plugin/tests/label_exporter_test.php
          plugin/classes/archive/resource_exporter.php plugin/tests/resource_exporter_test.php
          plugin/archive_process.php plugin/classes/external/get_tree.php
          plugin/tests/external/get_tree_test.php plugin/lang/en/local_flatarchive.php
          plugin/lang/fr/local_flatarchive.php plugin/lang/nl/local_flatarchive.php plugin/version.php
      - name: Run PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
