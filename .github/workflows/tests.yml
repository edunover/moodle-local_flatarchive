name: Flatarchive tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatarchive-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed AMD build
        run: git diff --exit-code -- amd/build
      - run: npm test
      - name: Verify installable package
        run: python3 scripts/package-plugin.py --output "$RUNNER_TEMP/flatarchive.zip"

  phpunit:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.1'
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.2'
          - moodle: '4.4'
            branch: MOODLE_404_STABLE
            php: '8.3'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.1'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.2'
          - moodle: '4.5'
            branch: MOODLE_405_STABLE
            php: '8.3'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.2'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.3'
          - moodle: '5.0'
            branch: MOODLE_500_STABLE
            php: '8.4'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.2'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.3'
          - moodle: '5.1'
            branch: MOODLE_501_STABLE
            php: '8.4'
          - moodle: '5.2'
            branch: MOODLE_502_STABLE
            php: '8.3'
          - moodle: '5.2'
            branch: MOODLE_502_STABLE
            php: '8.4'
          - moodle: '5.3'
            branch: MOODLE_503_STABLE
            php: '8.3'
            mariadb: '11.4'
          - moodle: '5.3'
            branch: MOODLE_503_STABLE
            php: '8.4'
            mariadb: '11.4'
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb || '10.11' }}
        env:
          MARIADB_ROOT_PASSWORD: flatarchive-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, soap, zip, gd, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle test tools
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '4.5.9'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install isolated Moodle and test database
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-user=root --db-pass=flatarchive-ci --no-plugin-node
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.branch }}
      - name: Check PHP syntax
        run: moodle-plugin-ci phplint
      - name: Check Moodle extra conventions for all PHP files
        if: matrix.moodle == '5.3' && matrix.php == '8.4'
        run: phpcs --standard=plugin/.phpcs.xml --extensions=php plugin
      - name: Run PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
